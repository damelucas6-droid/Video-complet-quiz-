name: Video Render CI

on:
  workflow_dispatch:
    inputs:
      quiz_json:
        description: "JSON du quiz"
        required: false
        default: ""

jobs:
  render-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Save quiz JSON from GitHub input
        shell: bash
        env:
          QUIZ_JSON: ${{ github.event.inputs.quiz_json }}
        run: |
          if [ -n "$QUIZ_JSON" ]; then
            printf '%s' "$QUIZ_JSON" > payload.json
          else
            cp quiz_prod.json payload.json
          fi

          echo "JSON reçu :"
          cat payload.json

      - name: Validate quiz
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from main import QuizPayload

          data = json.loads(Path("payload.json").read_text(encoding="utf-8"))
          QuizPayload(**data)
          print("Payload OK")
          PY

      - name: Generate video
        run: |
          python - <<'PY'
          import json, asyncio
          from pathlib import Path
          from main import QuizPayload, execute_quiz_background_task, TASK_REGISTRY

          payload = QuizPayload(**json.loads(Path("payload.json").read_text(encoding="utf-8")))
          task_id = "gh_run"

          TASK_REGISTRY[task_id] = {
              "task_id": task_id,
              "status": "queued",
              "progress": 0,
              "message": "Rendu démarré depuis GitHub Actions"
          }

          asyncio.run(execute_quiz_background_task(task_id, payload))
          print("Vidéo en cours de génération")
          PY

      - name: Show output
        run: |
          ls -la output

      - name: Upload generated MP4
        uses: actions/upload-artifact@v4
        with:
          name: generated-quiz-video
          path: output/*.mp4
          if-no-files-found: error

      - name: Notify n8n
        if: success()
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          curl -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "status": "completed",
              "message": "Video generated successfully",
              "file_name": "quiz_gh_run.mp4",
              "download_url": "https://github.com/<OWNER>/<REPO>/actions/runs/${{ github.run_id }}"
            }'
