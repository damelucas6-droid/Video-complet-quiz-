name: Video Render CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install httpx

      - name: Check project structure
        run: |
          mkdir -p assets output temp
          ls -la
          ls -la assets
          ls -la output
          ls -la temp

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Check API startup
        run: |
          python -c "import main; print('OK')"

      - name: Clean old output files
        run: |
          rm -f output/*.mp4
          ls -la output

      - name: Generate production quiz
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from main import QuizPayload
          data = json.loads(Path('quiz_prod.json').read_text(encoding='utf-8'))
          QuizPayload(**data)
          print('payload ok')
          PY

      - name: Run production render
        run: |
          python - <<'PY'
          import json, asyncio
          from pathlib import Path
          from main import QuizPayload, execute_quiz_background_task, TASK_REGISTRY

          payload = QuizPayload(**json.loads(Path('quiz_prod.json').read_text(encoding='utf-8')))
          task_id = 'prod_run'
          TASK_REGISTRY[task_id] = {'task_id': task_id, 'status': 'queued', 'progress': 0}
          asyncio.run(execute_quiz_background_task(task_id, payload))
          print('render started')
          PY

      - name: Show generated files
        run: |
          ls -la output

      - name: Upload generated MP4
        uses: actions/upload-artifact@v4
        with:
          name: production-quiz-video
          path: output/*.mp4
          if-no-files-found: error